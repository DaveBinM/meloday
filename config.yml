travel:
  - timezone: "Europe/London"                       # IANA timezone name for travel period
    start: "2025-12-10"                             # First day away (YYYY-MM-DD)
    end: "2026-01-11"                               # Last day away (YYYY-MM-DD)

cron:
  enabled: false                                    # Set to true to let Meloday write and maintain its own crontab entry
  python_path: ""                                   # Full path to your Python interpreter (e.g. /home/you/meloday/.venv/bin/python). Leave blank to use whichever Python is running this script.
  script_path: ""                                   # Full path to meloday.py (e.g. /home/you/meloday/meloday.py). Leave blank to detect automatically.
  # To install or update the schedule, run: python utilities/meloday_cron.py
  # To auto-switch times when a trip starts or ends, add this line to your crontab once:
  #   0 0 * * * /path/to/python /path/to/utilities/meloday_cron.py

plex:
  url: "http://localhost:32400"                     # The URL of your Plex Media Server
  token: "YOUR_PLEX_TOKEN"                          # Your Plex API authentication token
  music_library: "Music"                            # The name of your Plex music library
  exclude_label: "noshare"                          # Label(s) used to exclude tracks/albums. Accepts a single string or a list: ["noshare", "private"]
  christmas_collection: "Christmas Music"           # The name of the Christmas album collection

essentia:
  enabled: false
  cache_path: "assets/essentia_cache.db"
  bpm_weight: 0.15                                  # Influence of tempo on track distance
  key_weight: 0.15                                  # Influence of harmonic compatibility on track distance
  energy_weight: 0.10                               # Influence of loudness consistency
  era_weight: 0.05                                  # Influence of production era (year)
  danceability_weight: 0.08                         # Influence of rhythmic danceability difference
  brightness_weight: 0.06                           # Influence of spectral brightness (tonal darkness vs brightness)
  beat_confidence_weight: 0.07                      # Influence of beat/groove strength difference
  onset_rate_weight: 0.05                           # Influence of arrangement density difference
  arousal_weight: 0.10                              # Influence of arousal (energy/activation) difference — TF only
  valence_weight: 0.08                              # Influence of valence (positive/negative mood) difference — TF only
  vocal_weight: 0.04                                # Influence of vocal presence difference — TF only
  models_dir: assets/models                         # Directory containing essentia-tensorflow .pb model files
  path_mapping: {}                                  # Optional: {"/remote/path/": "/local/path/"} if script/server paths differ

bridging:
  enabled: true                                     # Set to false to skip adding bridging tracks between sonic jumps
  smart_truncation: false                           # Set to true to ensure max_tracks isn't exceeded. Set to false to ensure the best sonic flow

runtime:                                            # Overlap protection + hang bounds. Lockfiles live in assets/locks/ (MUST be a local filesystem — flock no-ops on network mounts)
  meloday_max_minutes: 90                            # Force-exit a meloday.py run after N minutes (0 disables). Backstop for a hung run holding its lock; paired with incremental cache writes so analysis isn't lost
  extras_max_minutes: 40                             # Force-exit a meloday_extras.py run after N minutes (0 disables). Extras never run Essentia, so this only trips on a true hang
  resolve_timeout_seconds: 180                       # Per-batch cap for parallel Plex track fetches (resolve_tracks_by_keys) so a stalled Plex call can't wedge an extras run

playlist:
  auto_apply_optimization: false                    # Set to true to automatically update this file with values from the optimizer
  exclude_played_days: 3                            # Ignore tracks played in the last X days to avoid repeats
  history_lookback_days: 60                         # How many days of listening history to analyze for playlist generation
  max_tracks: 50                                    # The maximum number of tracks allowed in a single playlist

  historical_ratio: 0.40                            # The max % of tracks sourced from listening history for each playlist
  style_ratio: 0.20                                 # The max % of tracks from a single style (e.g. "Emo", "Indie Rock") in the final playlist. Primary diversity axis.
  style_tag_depth: 1                                # How many of a track's style tags to check against the cap. 1 = primary style only; higher = multi-dimensional balancing. Optimizer sets this from your library's median style count.
  genre_ratio: 0.12                                 # Fallback cap: only applies to tracks that carry no style tags at all
  artist_ratio: 0.05                                # The max % of tracks from a single artist. Ensures no artist dominates the playlist.
  mood_ratio: 0.35                                  # The max % of tracks sharing the same primary mood. Prevents any single vibe from dominating.
  sonic_similarity_limit: 100                       # Candidate pool size per seed track — higher is more accurate but slower. Optimizer tunes this to your library density. Floor is 2× max_tracks.
  sonic_similarity_distance: 0.20                   # Maximum similarity distance for sonic matching (lower = stricter). The Plex max is 0.25; 0.20 excludes the loosest "loose" matches.

seasonal:
  christmas:
    start_month: 12                                 # The month Christmas music can start being included
    start_day: 1                                    # The day of the start month
    end_month: 12                                   # The month Christmas music should be excluded again
    end_day: 25                                     # The day of the end month


directories:
  cover_images: "assets/covers/flat"                # Path where cover images for playlists are stored
  fonts: "assets/fonts"                             # Path to font files used for text overlays


fonts:
  main: "Circular/Circular-Bold.ttf"                # Primary font used for playlist covers
  meloday: "Circular/Circular-Bold.ttf"             # Specific font for "Meloday" branding on covers
  light: "Circular/Circular-Book.ttf"               # Lighter-weight font for subtitles (falls back to main if missing)


time_periods:
  Dawn:
    hours: [5, 6]
    cover: "dawn_blank.webp"
  "Early Morning":
    hours: [7, 8]
    cover: "early-morning_blank.webp"
  Morning:
    hours: [9, 10, 11]
    cover: "morning_blank.webp"
  Afternoon:
    hours: [12, 13, 14, 15, 16]
    cover: "afternoon_blank.webp"
  Evening:
    hours: [17, 18, 19, 20]
    cover: "evening_blank.webp"
  Night:
    hours: [21, 22, 23]
    cover: "night_blank.webp"
  "Late Night":
    hours: [0, 1, 2, 3, 4]
    cover: "late-night_blank.webp"

extras:
  daily_mix_count: 6            # Number of Daily Mix playlists to generate (1–6)
  discover_weekly_size: 30      # Number of tracks in Discover Weekly
  release_radar_start_days: 14  # Initial Release Radar window (days)
  release_radar_step_days: 7    # Expand window by this many days if below min_tracks
  release_radar_min_tracks: 50  # Target track count; expand window until this many unique-artist releases are available
  release_radar_max_days: 90    # Hard cap on Release Radar window expansion
  birth_year:                   # Optional: enables era-anchored Time Capsule (e.g. 1990)
  lastfm_api_key:               # Optional: enables Last.fm popularity ranking in Release Radar
  lastfm_api_secret:            # Optional: required alongside lastfm_api_key
  top_songs_start_year: 2020    # Earliest year to generate a Top Songs playlist for (set to the year you started using Plex)
  mood_mix_count: 16            # Size of the rotating "anytime" mood/genre tier (the time-agnostic vibes). ADDED ON TOP of the uncapped context tier (every time/activity/weather/season-appropriate mix surfaces with no cap) + >=1 geo mix per city + 3 pinned scenes. Higher = more browse options on the shelf.
  mood_mix_rotations_per_day: 6 # How many times a day the anytime tier rotates to a fresh set. Run the extras generator AT LEAST this often — recommend HOURLY (0 * * * *): the slate tracks your schedule (workout, commute, dinner, going out) and only edits playlists that actually change, so frequent runs are cheap.
  mood_mix_exclude_played_days: 3 # Keep songs played in the last N days out of the mixes for variety (0 = disabled). Also dedupes tracks across the mixes shown at once.
  weather_location:             # Optional: city name, coordinates, or airport code (e.g. "Sydney") — enables weather-triggered mood mixes
  exclude_compilations_from_era: true          # Drop compilations (Various Artists, Greatest Hits, Best Of) from the decade/era mixes, using the MusicBrainz release type read from your files' tags
  era_excluded_release_types: ["compilation"]  # Which MusicBrainz release types the decade mixes exclude (add "soundtrack" / "live" to also drop those)

files:
  mood_map: "assets/moodmap.json"             

period_phrases:
  Dawn: "at dawn"
  "Early Morning": "early {day} morning"
  Morning: "morning"
  Afternoon: "afternoon"
  Evening: "evening"
  Night: "night"
  "Late Night": "late {day} night"

title_period_names:
  Dawn: "at dawn"
  "Early Morning": "early {day} morning"
  Morning: "morning"
  Afternoon: "afternoon"
  Evening: "evening"
  Night: "night"
  "Late Night": "late {day} night"
