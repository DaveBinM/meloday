plex:
  url: "http://localhost:32400"                     # The URL of your Plex Media Server
  token: "YOUR_PLEX_TOKEN"                          # Your Plex API authentication token
  music_library: "Music"                            # The name of your Plex music library
  exclude_label: "noshare"                          # Label(s) used to exclude tracks/albums. Accepts a single string or a list: ["noshare", "private"]
  christmas_collection: "Christmas Music"           # The name of the Christmas album collection

essentia:
  enabled: false
  cache_path: "assets/essentia_cache.db"
  bpm_weight: 0.15                                  # Influence of tempo on track distance
  key_weight: 0.15                                  # Influence of harmonic compatibility on track distance
  energy_weight: 0.10                               # Influence of loudness consistency
  era_weight: 0.05                                  # Influence of production era (year)
  path_mapping: {}                                  # Optional: {"/remote/path/": "/local/path/"} if script/server paths differ

bridging:
  enabled: true                                     # Set to false to skip adding bridging tracks between sonic jumps
  smart_truncation: false                           # Set to true to ensure max_tracks isn't exceeded. Set to false to ensure the best sonic flow

playlist:
  auto_apply_optimization: false                    # Set to true to automatically update this file with values from the optimizer
  exclude_played_days: 3                            # Ignore tracks played in the last X days to avoid repeats
  history_lookback_days: 60                         # How many days of listening history to analyze for playlist generation
  max_tracks: 50                                    # The maximum number of tracks allowed in a single playlist

  historical_ratio: 0.40                            # The max % of tracks sourced from listening history for each playlist
  style_ratio: 0.20                                 # The max % of tracks from a single style (e.g. "Emo", "Indie Rock") in the final playlist. Primary diversity axis.
  style_tag_depth: 1                                # How many of a track's style tags to check against the cap. 1 = primary style only; higher = multi-dimensional balancing. Optimizer sets this from your library's median style count.
  genre_ratio: 0.12                                 # Fallback cap: only applies to tracks that carry no style tags at all
  artist_ratio: 0.05                                # The max % of tracks from a single artist. Ensures no artist dominates the playlist.
  mood_ratio: 0.35                                  # The max % of tracks sharing the same primary mood. Prevents any single vibe from dominating.
  sonic_similarity_limit: 100                       # Candidate pool size per seed track — higher is more accurate but slower. Optimizer tunes this to your library density. Floor is 2× max_tracks.
  sonic_similarity_distance: 0.20                   # Maximum similarity distance for sonic matching (lower = stricter). The Plex max is 0.25; 0.20 excludes the loosest "loose" matches.

seasonal:
  christmas:
    start_month: 12                                 # The month Christmas music can start being included
    start_day: 1                                    # The day of the start month
    end_month: 12                                   # The month Christmas music should be excluded again
    end_day: 25                                     # The day of the end month


directories:
  cover_images: "assets/covers/flat"                # Path where cover images for playlists are stored
  fonts: "assets/fonts"                             # Path to font files used for text overlays


fonts:
  main: "Circular/Circular-Bold.ttf"                # Primary font used for playlist covers
  meloday: "Circular/Circular-Bold.ttf"             # Specific font for "Meloday" branding on covers


time_periods:
  Dawn: 
    hours: [3, 4, 5]   
    cover: "dawn_blank.webp"
  "Early Morning": 
    hours: [6, 7, 8]
    cover: "early-morning_blank.webp"
  Morning: 
    hours: [9, 10, 11]
    cover: "morning_blank.webp"
  Afternoon: 
    hours: [12, 13, 14, 15]
    cover: "afternoon_blank.webp"
  Evening: 
    hours: [16, 17, 18]
    cover: "evening_blank.webp"
  Night: 
    hours: [19, 20, 21]
    cover: "night_blank.webp"
  "Late Night": 
    hours: [22, 23, 0, 1, 2]           
    cover: "late-night_blank.webp"

files:
  mood_map: "assets/moodmap.json"             

period_phrases:
  Dawn: "dawn"
  "Early Morning": "early morning"
  Morning: "morning"
  Afternoon: "afternoon"
  Evening: "evening"
  Night: "night"
  "Late Night": "late-night"
